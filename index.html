<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JINDEVINESIA – ร้านโทรศัพท์</title>
<meta name="theme-color" content="#F5F2EC">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600&family=Playfair+Display:wght@900&display=swap">
<style>
:root {
  --bg:#F5F2EC;
  --card:#F3E9E4;
  --ink:#442E23;
  --mut:#8a7468;
  --pink:#FAD1D8;
  --brand:#6B4630;
  --red:#8B0000;
  --blue:#6fa3c4;
  --bar:#fff;
  --pill:#2a1c15;
  --pillt:#fff;
  --line:#e6d9d0;
}

@media(prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1e1613;--card:#2b201b;--ink:#f1e6dc;--mut:#b9a698;--bar:#2b201b;--pill:#FAD1D8;--pillt:#2a1c15;--line:#44342c;--brand:#e0b9a3;--red:#ff9a9a
  }
}
:root[data-theme="dark"]{--bg:#1e1613;--card:#2b201b;--ink:#f1e6dc;--mut:#b9a698;--bar:#2b201b;--pill:#FAD1D8;--pillt:#2a1c15;--line:#44342c;--brand:#e0b9a3;--red:#ff9a9a}

html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Prompt,'Noto Sans Thai',system-ui,sans-serif;font-size:14px;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#app{max-width:480px;margin:auto;min-height:100vh;padding-bottom:96px}
button,input,select{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.bar{display:flex;align-items:center;justify-content:space-between;padding:12px 16px}
.rb{width:40px;height:40px;border-radius:50%;background:var(--card);display:grid;place-items:center}
.pg{padding:16px}h2{margin:8px 0 12px;color:var(--brand)}
.sec{margin:18px 16px 8px;font-weight:600;font-size:17px;color:var(--brand);border-bottom:1.5px solid var(--ink);padding-bottom:4px}

/* welcome */
.wc{min-height:100vh;margin-bottom:-96px;display:flex;flex-direction:column;background:var(--bg)}
.wh{flex:1;min-height:50vh;position:relative;background-size:cover;background-position:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;color:#fff;padding:30px 20px 80px;text-shadow:0 2px 10px #0006;background-color:var(--brand)}
.wh:before{content:'';position:absolute;inset:0;background:linear-gradient(#0001,#0005)}.wh>*{position:relative}
.lg{width:92px;height:92px;border-radius:50%;background:#fff;display:grid;place-items:center;overflow:hidden;box-shadow:0 6px 20px #0004;color:#6B4630;font-size:38px;text-shadow:none}
.wh h1{margin:10px 0 0;font-size:28px;letter-spacing:2px;font-weight:600}.wh p{margin:0;font-size:14px;opacity:0.9}
.ws{background:var(--bg);margin-top:-50px;border-radius:50% 50% 0 0/38px;padding:30px 24px 34px;text-align:center;position:relative}
.ws h2{margin:0 0 10px;font-size:28px;letter-spacing:1px;font-weight:700;color:var(--brand)}
.wd{color:var(--mut);line-height:1.6;margin-bottom:14px}
.wb1,.wb2{display:block;width:100%;padding:15px;border-radius:999px;font-weight:500;margin-top:12px;text-align:center;text-decoration:none;box-sizing:border-box}
.wb1{background:var(--pill);color:var(--pillt)}.wb2{border:1px solid var(--line);background:var(--bar);color:var(--ink)}

/* home */
.sr{margin:0 16px;position:relative}.sr input{padding-left:42px}.sr svg{position:absolute;left:12px;top:10px;color:var(--mut)}
label{display:block;margin:12px 0 4px;color:var(--mut);font-size:13px}
input,select{width:100%;padding:11px 14px;border-radius:14px;border:1px solid var(--line);background:var(--card)}
#bn{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:0;margin:14px 16px 0;border-radius:22px;scrollbar-width:none}
#bn::-webkit-scrollbar{display:none}
.sl{flex:none;width:100%;height:130px;scroll-snap-align:start;padding:18px;color:#fff;display:flex;flex-direction:column;justify-content:center;background:linear-gradient(135deg, var(--brand), #8b5a3c);border-radius:22px}
.sl b{font-size:19px}.sl span{opacity:.85;margin-top:4px}
.ch{display:flex;gap:8px;overflow-x:auto;padding:10px 16px;scrollbar-width:none}.ch::-webkit-scrollbar{display:none}
.ch button{flex:none;padding:7px 14px;border-radius:999px;background:var(--card);color:var(--blue);font-weight:500;border:1px solid transparent}
.ch .on{background:var(--pill);color:var(--pillt);border-color:var(--pill)}
.g{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:6px 14px}

/* glass product card */
.cd{position:relative;border-radius:28px;overflow:hidden;color:var(--ink);background:var(--card);box-shadow:0 10px 22px #0001;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;padding:12px;border:1px solid var(--line)}
.cd .im{height:140px;border-radius:18px;background:var(--bar);display:grid;place-items:center;margin-bottom:8px;overflow:hidden}
.cd .tt b{font-size:15px;font-weight:600}
.pp{background:var(--pink);color:var(--ink);border-radius:999px;padding:3px 8px;font-size:12px;font-weight:600;display:inline-block;margin-top:4px}
.wb{display:block;width:100%;background:var(--brand);color:#fff;border-radius:999px;padding:8px;font-weight:600;font-size:12px;margin-top:8px;text-align:center}

/* nav pill */
#nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(480px,100%);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));z-index:4}
#nav div{background:var(--bar);border-radius:20px;padding:8px 14px;display:flex;justify-content:space-around;align-items:center;box-shadow:0 6px 24px #0002}
#nav button{display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:999px;color:var(--ink);font-weight:500;font-size:13px}
#nav .on{background:var(--pill);color:var(--pillt)}
#nav button:not(.on) span{display:none}

#ts{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:var(--pill);color:var(--pillt);padding:9px 18px;border-radius:999px;opacity:0;transition:.3s;pointer-events:none;z-index:9}
</style>
</head>
<body>

<div id="app"></div>
<div id="nav"></div>
<div id="ts"></div>

<noscript>ต้องเปิด JavaScript เพื่อใช้งานเว็บนี้</noscript>

<script>
// Mockup Application Logic
const state = {
  page: 'welcome', // 'welcome' | 'home' | 'cart'
  category: 'all',
  products: [
    { id: 1, name: 'iPhone 15 Pro', price: '39,900 ฿', brand: 'Apple', icon: '📱' },
    { id: 2, name: 'Samsung S24 Ultra', price: '42,900 ฿', brand: 'Samsung', icon: '📲' },
    { id: 3, name: 'iPad Air 5', price: '21,900 ฿', brand: 'Apple', icon: '📱' },
    { id: 4, name: 'Xiaomi 14', price: '29,900 ฿', brand: 'Xiaomi', icon: '📲' }
  ]
};

function renderApp() {
  const app = document.getElementById('app');
  const nav = document.getElementById('nav');

  if (state.page === 'welcome') {
    nav.innerHTML = '';
    app.innerHTML = `
      <div class="wc">
        <div class="wh">
          <div class="lg">📱</div>
          <h1>JINDEVINESIA</h1>
          <p>ร้านจำหน่ายโทรศัพท์และอุปกรณ์เสริม</p>
        </div>
        <div class="ws">
          <h2>ยินดีต้อนรับ</h2>
          <p class="wd">ศูนย์รวมสมาร์ทโฟนแท้ มือ 1 และมือ 2 คุณภาพดี พร้อมบริการผ่อนชำระง่ายๆ</p>
          <button class="wb1" onclick="navigateTo('home')">เข้าสู่ร้านค้า</button>
          <button class="wb2" onclick="showToast('ระบบสมาชิกกำลังปรับปรุง')">เข้าสู่ระบบ / สมัครสมาชิก</button>
        </div>
      </div>
    `;
  } else if (state.page === 'home') {
    renderNav();
    app.innerHTML = `
      <div class="bar">
        <b style="font-size:18px; color:var(--brand)">JINDEVINESIA</b>
        <div class="rb">🔔</div>
      </div>
      
      <div class="sr">
        <input type="text" placeholder="ค้นหารุ่นโทรศัพท์...">
      </div>

      <div id="bn">
        <div class="sl">
          <b>โปรโมชั่นผ่อน 0%</b>
          <span>อนุมัติไว ใช้เพียงบัตรประชาชน</span>
        </div>
      </div>

      <div class="sec">หมวดหมู่สินค้า</div>
      <div class="ch">
        <button class="${state.category === 'all' ? 'on' : ''}" onclick="filterCat('all')">ทั้งหมด</button>
        <button class="${state.category === 'Apple' ? 'on' : ''}" onclick="filterCat('Apple')">Apple</button>
        <button class="${state.category === 'Samsung' ? 'on' : ''}" onclick="filterCat('Samsung')">Samsung</button>
        <button class="${state.category === 'Xiaomi' ? 'on' : ''}" onclick="filterCat('Xiaomi')">Xiaomi</button>
      </div>

      <div class="sec">สินค้าแนะนำ</div>
      <div class="g">
        ${state.products
          .filter(p => state.category === 'all' || p.brand === state.category)
          .map(p => `
            <div class="cd">
              <div class="im" style="font-size:48px">${p.icon}</div>
              <div class="tt">
                <b>${p.name}</b>
              </div>
              <div class="pp">${p.price}</div>
              <button class="wb" onclick="showToast('เพิ่ม ${p.name} เรียบร้อย')">ดูรายละเอียด</button>
            </div>
          `).join('')}
      </div>
    `;
  }
}

function renderNav() {
  const nav = document.getElementById('nav');
  nav.innerHTML = `
    <div>
      <button class="${state.page === 'home' ? 'on' : ''}" onclick="navigateTo('home')">
        <svg class="i" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
        <span>หน้าแรก</span>
      </button>
      <button class="${state.page === 'welcome' ? 'on' : ''}" onclick="navigateTo('welcome')">
        <svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><path d="M12 8v4l3 3"></path></svg>
        <span>หน้าแรกสุด</span>
      </button>
    </div>
  `;
}

function navigateTo(page) {
  state.page = page;
  renderApp();
}

function filterCat(cat) {
  state.category = cat;
  renderApp();
}

function showToast(msg) {
  const ts = document.getElementById('ts');
  ts.innerText = msg;
  ts.style.opacity = '1';
  setTimeout(() => ts.style.opacity = '0', 2000);
}

// Initial Render
renderApp();
</script>

<!-- กรณีเปิดใช้ Firebase Module จริง สามารถเรียกใต้ script หรือนำไปใช้งานร่วมกันได้ -->
<script type="module" src="firebase.js"></script>
</body>
</html>
