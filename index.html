<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JINDEVINESIA – ร้านโทรศัพท์</title>
<meta name="theme-color" content="#F5F2EC">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600&family=Playfair+Display:wght@900&display=swap">
<style>
:root{--bg:#F5F2EC;--card:#F3E9E4;--ink:#442E23;--mut:#8a7468;--pink:#FAD1D8;--brand:#6B4630;--red:#8B0000;--blue:#6fa3c4;--bar:#fff;--pill:#2a1c15;--pillt:#fff;--line:#e6d9d0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1e1613;--card:#2b201b;--ink:#f1e6dc;--mut:#b9a698;--bar:#2b201b;--pill:#FAD1D8;--pillt:#2a1c15;--line:#44342c;--brand:#e0b9a3;--red:#ff9a9a}}
:root[data-theme="dark"]{--bg:#1e1613;--card:#2b201b;--ink:#f1e6dc;--mut:#b9a698;--bar:#2b201b;--pill:#FAD1D8;--pillt:#2a1c15;--line:#44342c;--brand:#e0b9a3;--red:#ff9a9a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Prompt,'Noto Sans Thai',system-ui,sans-serif;font-size:14px}
#app{max-width:480px;margin:auto;min-height:100vh;padding-bottom:96px}
button,input,select{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.bar{display:flex;align-items:center;justify-content:space-between;padding:12px 16px}
.rb{width:40px;height:40px;border-radius:50%;background:var(--card);display:grid;place-items:center}
.pg{padding:16px}h2{margin:8px 0 12px;color:var(--brand)}
.sec{margin:18px 16px 8px;font-weight:600;font-size:17px;color:var(--brand);border-bottom:1.5px solid var(--ink);padding-bottom:4px}
/* welcome */
.wl{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;background:repeating-linear-gradient(90deg,#dfe4fa 0 14px,#fff 14px 28px);color:#6B4630}
.wl .arc{width:300px;margin-bottom:-28px;position:relative;z-index:1}
.ci{width:230px;height:230px;border-radius:50%;overflow:hidden;background:linear-gradient(#c5e6fb,#eef8ff)}
.wl h1{font-family:'Playfair Display',serif;font-weight:900;font-size:34px;letter-spacing:1px;margin:10px 0 0;text-shadow:0 2px 0 #fff}
.op{background:#0aa84f;color:#fff;font-weight:600;font-size:22px;padding:2px 22px;border-radius:12px}
.nt{background:#f3ede8;color:#a58a76;border-radius:10px;padding:4px 14px;font-size:13px;letter-spacing:1px}
.bt{background:var(--brand);color:var(--brandt,#fff);border-radius:999px;padding:11px 28px;font-weight:500}
.lk{color:#6B4630;text-decoration:underline;font-size:13px}
/* auth */
label{display:block;margin:12px 0 4px;color:var(--mut);font-size:13px}
input,select{width:100%;padding:11px 14px;border-radius:14px;border:1px solid var(--line);background:var(--card)}
.r3{display:grid;grid-template-columns:1fr 1fr 1.6fr;gap:8px}
.seg{display:flex;background:var(--card);border-radius:999px;padding:4px;margin:0 16px}
.seg button{flex:1;padding:8px;border-radius:999px;color:var(--mut)}.seg .on{background:var(--pill);color:var(--pillt)}
/* home */
.sr{margin:0 16px;position:relative}.sr input{padding-left:42px}.sr svg{position:absolute;left:12px;top:10px;color:var(--mut)}
#bn{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:0;margin:14px 16px 0;border-radius:22px;scrollbar-width:none}
#bn::-webkit-scrollbar{display:none}
.sl{flex:none;width:100%;height:130px;scroll-snap-align:start;padding:18px;color:#fff;display:flex;flex-direction:column;justify-content:center}
.sl b{font-size:19px}.sl span{opacity:.85;margin-top:4px}
.ch{display:flex;gap:8px;overflow-x:auto;padding:10px 16px;scrollbar-width:none}.ch::-webkit-scrollbar{display:none}
.ch button{flex:none;padding:7px 14px;border-radius:999px;background:var(--card);color:var(--blue);font-weight:500;border:1px solid transparent}
.ch .on{background:var(--pill);color:var(--pillt);border-color:var(--pill)}
.g{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:6px 14px}
/* glass product card */
.cd{position:relative;border-radius:28px;overflow:hidden;color:#fff;height:340px;background:var(--t);box-shadow:0 10px 22px #0003;cursor:pointer}
.cd .im{position:absolute;inset:0 0 auto 0;height:58%;-webkit-mask-image:linear-gradient(#000 55%,transparent);mask-image:linear-gradient(#000 55%,transparent)}
.cd .im svg,.dim svg{width:100%;height:100%;display:block}
.cd .bd{position:absolute;inset:auto 0 0 0;padding:0 12px 12px}
.dots{display:flex;gap:4px;justify-content:center;margin-bottom:8px}.dots i{width:5px;height:5px;border-radius:50%;background:#fff6}.dots i:first-child{background:#fff}
.tt{display:flex;justify-content:space-between;align-items:center;gap:4px}.tt b{font-size:15px;font-weight:600}
.pp{background:#0006;border-radius:999px;padding:3px 8px;font-size:11px;font-weight:600;white-space:nowrap}
.ds{font-size:11px;line-height:1.45;color:#ffffffb0;margin:5px 0 7px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tg{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:9px}.tg span{background:#ffffff2e;border-radius:999px;padding:3px 9px;font-size:10.5px;font-weight:500}
.wb{display:block;width:100%;background:#fff;color:#111;border-radius:999px;padding:10px;font-weight:600;font-size:13px}
.cd .hb{position:absolute;top:10px;right:10px;width:32px;height:32px;border-radius:50%;background:#0004;color:#fff;display:grid;place-items:center}
.cd .hb.f{color:#ff7a93}.cd .hb.f svg{fill:#ff7a93}
.bdg{position:absolute;top:12px;left:10px;display:flex;gap:4px;flex-direction:column;align-items:flex-start}
.bdg span{background:var(--pink);color:#442E23;font-size:10.5px;font-weight:600;padding:2px 9px;border-radius:999px}
.bdg .cdx{background:#0005;color:#fff}
/* detail */
.dim{height:300px;margin:0 16px;border-radius:22px;overflow:hidden}
.bx{margin:14px 16px;background:var(--card);border:1px solid var(--line);border-radius:28px;padding:14px 18px}
.bx h3{margin:0 0 4px;font-size:22px}.rd{color:var(--red);font-weight:600}
.sv{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.sv button{padding:6px 12px;border-radius:999px;border:1px solid var(--blue);color:var(--blue);font-weight:500}.sv .on{background:var(--pill);color:var(--pillt);border-color:var(--pill)}
.rw{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px dashed var(--line)}
input[type=range]{padding:0;accent-color:var(--brand)}
.bb{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(480px,100%);background:var(--card);border-radius:24px 24px 0 0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;justify-content:space-between;box-shadow:0 -6px 20px #0002;z-index:5}
.bb small{color:var(--mut)}.bb b{font-size:22px;color:var(--red)}
.ob{border:2px solid var(--brand);padding:9px 22px;font-weight:600;font-size:16px;border-radius:8px}
/* nav pill */
#nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(480px,100%);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));z-index:4}
#nav div{background:var(--bar);border-radius:20px;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 6px 24px #0003}
#nav button{display:flex;align-items:center;gap:8px;padding:10px;border-radius:999px;color:var(--ink);font-weight:500}
#nav .on{background:var(--pill);color:var(--pillt);padding:10px 16px}#nav button:not(.on) span{display:none}
/* misc */
.rg{display:block;margin:6px auto;width:170px}.rg text{fill:var(--ink)}
.it{display:flex;gap:10px;align-items:center;background:var(--card);border-radius:20px;padding:10px;margin:0 16px 10px}
.it .th{width:60px;height:60px;border-radius:14px;overflow:hidden;flex:none}.it .th svg{width:100%;height:100%}.it .m{flex:1}.it small{color:var(--mut)}
#ts{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:var(--pill);color:var(--pillt);padding:9px 18px;border-radius:999px;opacity:0;transition:.3s;pointer-events:none;z-index:9}
.st{display:inline-flex;align-items:center;gap:6px;padding:3px 12px;border-radius:999px;font-weight:600;font-size:13px}.st i{width:8px;height:8px;border-radius:50%;background:currentColor}.st.o{background:#dff3e6;color:#1d7a47}.st.x{background:#fbe0e0;color:#b03a3a}
#bn .sl{height:190px;text-decoration:none}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.g3 div{background:var(--card);border-radius:16px;padding:12px 6px;text-align:center;font-size:12px;font-weight:500}
.cta{flex:none;padding:9px 18px;border-radius:999px;background:var(--pink);color:#442E23;text-decoration:none;font-weight:500}
.pr{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:6px 16px 10px;scrollbar-width:none}.pr::-webkit-scrollbar{display:none}.pr .cd{flex:none;width:200px;scroll-snap-align:start}
.qq{background:#fde3e8;color:#6b2c3a;border-radius:16px 16px 16px 4px;padding:10px 14px;font-weight:500;margin-top:10px;margin-right:24px}
.qa{background:#e3eefa;color:#2c4a6b;border-radius:16px 16px 4px 16px;padding:10px 14px;margin:6px 0 6px 24px;line-height:1.5}
.up{margin:0 16px 12px;padding:8px 14px;border-radius:12px;background:var(--card);color:var(--mut);font-size:13px}
.qm{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px}.qm button{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 2px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:500;color:var(--brand)}
.ag{position:relative;overflow:hidden;min-height:100vh;margin-bottom:-96px;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 15% 12%,#FAD1D8 0,transparent 45%),radial-gradient(circle at 88% 85%,#c3dc7c 0,transparent 42%),radial-gradient(circle at 75% 15%,#cfe9fb 0,transparent 40%),#ece0d3}
.ag i{position:absolute;border-radius:50%}.b1{width:240px;height:240px;background:#a5714f;top:14%;left:-50px}.b2{width:210px;height:210px;background:#f1a9b9;bottom:12%;right:-40px}
.gl{position:relative;width:100%;max-width:400px;padding:22px 24px 26px;border-radius:44px;background:rgba(255,255,255,.3);-webkit-backdrop-filter:blur(22px) saturate(1.4);backdrop-filter:blur(22px) saturate(1.4);border:1px solid rgba(255,255,255,.75);box-shadow:0 20px 50px #442e2338,inset 0 1px 0 #fffa;color:#3a2a20;animation:pop .65s cubic-bezier(.2,1.3,.4,1) both}
@keyframes pop{from{opacity:0;transform:translateY(34px) scale(.86)}to{opacity:1;transform:none}}
.gl input{background:rgba(255,255,255,.5);border:1px solid #fff9;color:#3a2a20}.gl label{color:#5b4639}.gl .seg{background:rgba(255,255,255,.35)}.gl .seg button{color:#5b4639}.gl .seg .on{color:#fff}
.gl .gb{display:block;width:100%;margin-top:16px;padding:13px;border-radius:999px;background:rgba(255,255,255,.35);border:1px solid #fff;font-weight:600;color:#3a2a20}
.gl .rr{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-size:13px}.gl .rr label{margin:0;display:flex;gap:6px;align-items:center}.gl .rr input{width:auto}
.mi{display:flex;justify-content:space-between;width:100%;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px 18px;margin-bottom:10px;font-weight:500;color:var(--ink)}
.gr{color:#9a9a9a;font-size:12px;padding:6px}
.gy>.th,.gy>.m{opacity:.4;filter:grayscale(1)}
.ta{width:100%;padding:11px 14px;border-radius:14px;border:1px solid var(--line);background:var(--card);min-height:80px;font:inherit;color:inherit}
.seg{overflow-x:auto;scrollbar-width:none}.seg button{white-space:nowrap;padding:8px 12px}
.wc{min-height:100vh;margin-bottom:-96px;display:flex;flex-direction:column;background:var(--bg)}
.wh{flex:1;min-height:58vh;position:relative;background-size:cover;background-position:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;color:#fff;padding:30px 20px 80px;text-shadow:0 2px 10px #0006}
.wh:before{content:'';position:absolute;inset:0;background:linear-gradient(#0001,#0005)}.wh>*{position:relative}
.lg{width:92px;height:92px;border-radius:50%;background:#fff;display:grid;place-items:center;overflow:hidden;box-shadow:0 6px 20px #0004;color:#6B4630;font-size:38px;text-shadow:none}.lg img{width:100%;height:100%;object-fit:cover}
.wh h1{margin:10px 0 0;font-size:30px;letter-spacing:2px;font-weight:600}.wh p{margin:0;font-size:16px}
.ws{background:var(--bg);margin-top:-50px;border-radius:50% 50% 0 0/38px;padding:30px 24px 34px;text-align:center;position:relative}
.ws h2{margin:0 0 10px;font-size:34px;letter-spacing:2px;font-weight:700;color:var(--brand)}
.wd{color:var(--mut);line-height:1.6;margin-bottom:14px}
.wb1,.wb2{display:block;width:100%;padding:15px;border-radius:999px;font-weight:500;margin-top:12px}
.wb1{background:var(--pill);color:var(--pillt)}.wb2{border:1px solid var(--line);background:var(--bar);color:var(--ink)}
.ag.im i{display:none}
.pb{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin:6px 0}.pb i{display:block;height:100%;background:var(--brand);border-radius:99px}
.stb{background:var(--pink);color:#442E23;border-radius:99px;padding:2px 10px;font-size:12px;font-weight:600}
select{flex:1;padding:8px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:inherit;font:inherit}
.pd{display:flex;gap:8px;align-items:flex-start;font-size:12px;margin-top:12px;line-height:1.5}.pd input{width:auto;margin-top:3px}
.ddb{display:flex;align-items:center;gap:8px;width:100%;padding:12px 16px;border-radius:16px;background:linear-gradient(120deg,var(--brand),#c98a99);color:var(--brandt,#fff);font-weight:600;font-size:15px}
.ddm{margin-top:8px;background:var(--bar);border-radius:22px;box-shadow:0 10px 30px #0003;padding:8px}
.ddi{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px;border-radius:14px;color:var(--ink)}.ddi:active{background:var(--card)}.ddi small{display:block;color:var(--mut);font-size:12px}.ddt{flex:1}.ddic{font-size:22px;width:30px;text-align:center}.ddck{font-size:20px}
.pyi{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}.pyi span{position:relative}.pyi img{width:84px;height:84px;object-fit:cover;border-radius:12px}.pyi button{position:absolute;top:2px;right:2px;background:#0008;color:#fff;border-radius:50%;width:22px;height:22px;font-size:12px}
</style>
</head>
<body>
<div id="app"></div>
<div id="nav"></div>
<div id="ts"></div>
<noscript>ต้องเปิด JavaScript เพื่อใช้งานเว็บนี้</noscript>
<script type="module" src="firebase.js"></script>
</body>
</html>
